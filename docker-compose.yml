services:
  trading-bot:
    build: .
    container_name: trading-bot-pro
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config/strategy.local.json:/app/config/strategy.local.json:ro
    mem_limit: 512m
    cpus: "0.50"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
