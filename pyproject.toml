[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-pro"
version = "0.1.0"
description = "Algorithmic Volatility & Equity Trading Bot with deterministic risk guardian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py",
    "finnhub-python",
    "google-genai",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
